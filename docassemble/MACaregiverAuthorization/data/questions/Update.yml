id: temporary_agent_authorization
continue button field: temporary_agent_esp_intro
question: "Temporary Agent Authorization"
subquestion: |2-
  ### Why should I fill out a Temporary Agent Authorization?
  * A Temporary Agent Authorization gives a caregiver the power and responsibility
    to make decisions for your child's healthcare, education, property and finances.
  * The Agent cannot give permission for your child to marry or be adopted.
  * The authorization gives the agent the power to make decisions in your child’s life for up to 60 days after you are detained or unavailable.
  * You have the right to end the authorization at any time.
  * After 60 days, you can renew the authorization, but you must complete a new form.

  ### Before you get started
  - Ensure you have the names and birthdates of the children involved.
  - Decide who you want to appoint as the temporary agent.
  - You do not have to put all your children on one form. You can fill out a form for each child. Each child needs their own form if they have different caregivers or parents.

  ### What you will need
  * You will need 2 witnesses to sign the form with you.
  * The agent must sign the form.
  * You can add a second person to the form, in case the person you picked to be Temporary Agent is not available.
  * You may need the other parent of your child to sign the form if you know where they are and if they are able and willing to provide care.

  ### When you are finished
  - Sign the form in the presence of witnesses.
  - Provide a copy to the appointed agent and keep one for your records.

  If you are a parent or legal guardian and need someone to make decisions for your child temporarily, this form is for you. It allows you to appoint a trusted individual to act on your behalf in specific situations.
---
id: Appointing Party Information
question: |
  Appointing Party Information
subquestion: |2-
  You are the "appointing party." In this section, please provide:
  * your full name
  * your address
  * your relationship to the child
fields:
  - Name: user1_full_name
  - Address: user1_address
  - Relationship to child: user1_status_to_child
    datatype: dropdown
    choices:
      - parent
      - legal guardian
      - legal custodian
  - label: Printed Name
    field: user1_printed_name
    required: False
---
id: Temporary Agent Details
question: |
  Temporary Agent Details
subquestion: |
  Provide information about the temporary agent.
fields:
  - "Temporary agent acknowledgment name": temp_agent_acknowledgement_name
  - "Temporary agent residential address": temp_agent_address
  - "Temporary agent printed name": temp_agent_printed_name
  - "Date of temporary agent appointment": temp_agent_date
    datatype: date
---
id: Children s Information
question: |
  Children's Information
subquestion: |
  List the minor children involved. You will provide the names first and then the birth dates for each child.
fields:
  - "Child1 date of birth": child1_birth_date
    datatype: date
  - "Child2 date of birth": child2_birth_date
    datatype: date
  - "Child3 date of birth": child3_birth_date
    datatype: date
  - "Child4 date of birth": child4_birth_date
    datatype: date
---
id: Prohibited Acts
question: |
  Prohibited Acts
subquestion: |
  Specify any acts the agent is prohibited from performing.
fields:
  - "Prohibited acts for temp agent": temp_agent_prohibitive_acts
    input type: area
---
id: Alternate Agent Information
question: |
  Alternate Agent Information
subquestion: |
  Provide details of an optional alternate agent.
fields:
  - "Optional agent acknowledgment name": optional_agent_acknowledgment_name
  - "Optional agent residential address": optional_agent_address
  - "Optional agent printed name": optional_agent_printed_name
  - "Date of optional agent appointment": optional_agent_date
    datatype: date
---
id: Non Appointing Parent Consent
question: |
  Non-Appointing Parent Information
subquestion: |
  Provide information regarding the non-appointing parent.
fields:
  - "Nonappointing parent current status": nonappointing_parent_status
  - "Nonappointing parent residential address": nonappointing_parent_address
  - "Nonappointing parent printed name": nonappointing_parent_printed_name
---
id: Non Appointing Parent Consent Status
