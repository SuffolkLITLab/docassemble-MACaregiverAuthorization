metadata:
  title: >-
    Temporary Agent Esp
  short title: >-
    Temporary Agent Esp
  description: |-
    This form allows a parent or guardian to appoint a temporary agent to make decisions regarding the care, custody, or property of their minor child. It ensures that the appointed agent can act in the child's best interests when the parent is unavailable.
  can_I_use_this_form: |
    If you are a parent or legal guardian and need someone to make decisions for your child temporarily, this form is for you. It allows you to appoint a trusted individual to act on your behalf in specific situations.
  before_you_start: |
    ### Before you get started
    - Ensure you have the names and birthdates of the children involved.
    - Decide who you want to appoint as the temporary agent.

    ### When you are finished
    - Sign the form in the presence of witnesses.
    - Provide a copy to the appointed agent and keep one for your records.
  when_you_are_finished: |
    After you complete and sign the form, make sure to give a copy to the temporary agent. It's also a good idea to inform any relevant parties about this appointment. Keep a copy for your own records.
