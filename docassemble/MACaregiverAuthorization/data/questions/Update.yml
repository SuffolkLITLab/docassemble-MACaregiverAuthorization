---
id: download temporary_agent_esp
event: temporary_agent_esp_download
question: |
  All done
subquestion: |
  % if defined("users[0]"):
  Thank you ${ users }. Your form is ready to download and deliver.
  % else:
  Thank you. Your form is ready to download and deliver.
  % endif

  Use the options on this page to view, download and send your form. Use the
  "Edit answers" button to fix any mistakes.

  ${ action_button_html(url_action('review_temporary_agent_esp'), label=word('Edit answers'), color='info') }

  ${ al_user_bundle.download_list_html() }

  ${ al_user_bundle.send_button_html(show_editable_checkbox=False) }

progress: 100
---
# ALDocument objects specify the metadata for each template
objects:
  - temporary_agent_esp_Post_interview_instructions: ALDocument.using(filename="temporary_agent_esp_next_steps.docx", title=str(temporary_agent_esp_Post_interview_instructions_title), enabled=True, has_addendum=False)
  - temporary_agent_esp_attachment: ALDocument.using(filename="temporary_agent_esp", title=str(temporary_agent_esp_attachment_title), enabled=True, has_addendum=False)
---
# Bundles group the ALDocuments into separate downloads, such as for court and for the user
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[temporary_agent_esp_Post_interview_instructions, temporary_agent_esp_attachment, temporary_agent_espwithfields_next_steps], filename="temporary_agent_esp", enabled=True, title=str(al_user_bundle_title))
  - al_recipient_bundle: ALDocumentBundle.using(elements=[temporary_agent_esp_attachment, temporary_agent_espwithfields_next_steps], filename="temporary_agent_esp", enabled=True, title=str(al_recipient_bundle_title))
---
template: temporary_agent_esp_Post_interview_instructions_title
content: |
  Instructions
---
template: temporary_agent_esp_attachment_title
content: |
  Temporary Agent Esp
---
template: al_user_bundle_title
content: |
  All forms to download for your records
---
template: al_recipient_bundle_title
content: |
  All forms to file
---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the
# same template is used for "preview" and "final" keys, and logic in the template checks
# the value of `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: temporary_agent_esp_next_steps
  docx template file: temporary_agent_esp_next_steps.docx
  variable name: temporary_agent_esp_Post_interview_instructions[i]
  skip undefined: True
  tagged pdf: True
---
attachment:
  name: temporary agent esp
  filename: temporary_agent_esp
  variable name: temporary_agent_esp_attachment[i]
  skip undefined: True
  pdf template file: Temporary_Agent_Esp.pdf
  fields:
      - "user1_address": ${ user1_address }
      - "user1_full_name": ${ user1_full_name }
      - "soy": ${ soy }
      - "temp_agent": ${ temp_agent }
      - "temp_agent_address": ${ temp_agent_address }
      - "child3_birth_date": ${ child3_birth_date.format() }
      - "child3_name": ${ children[2] }
      - "child1_name": ${ children[0] }
      - "child1_birth_date": ${ child1_birth_date.format() }
      - "child2_name": ${ children[1] }
      - "child2_birth_date": ${ child2_birth_date.format() }
      - "child4_birth_date": ${ child4_birth_date.format() }
      - "child4_name": ${ children[3] }
      - "temp_agent_prohibitive_acts": ${ temp_agent_prohibitive_acts }
      - "optional_agent": ${ optional_agent }
      - "optional_agent_address": ${ optional_agent_address }
      - "nonappointing_parent_status": ${ nonappointing_parent_status }
      - "nonappointing_parent_missing_consent": ${ nonappointing_parent_missing_consent }
      - "user1_signature": ${ users[0].signature_if_final(i) }
      - "user1_printed_name": ${ user1_printed_name }
      - "user1_phone_number": ${ users[0].phone_number }
      - "temp_agent_acknowledgement_name": ${ temp_agent_acknowledgement_name }
      - "temp_agent_signature": ${ temp_agent[0].signature_if_final(i) }
      - "temp_agent_printed_name": ${ temp_agent_printed_name }
      - "temp_agent_phone_number": ${ temp_agent[0].phone_number }
      - "temp_agent_date": ${ temp_agent_date.format() }
      - "optional_agent_acknowledgment_name": ${ optional_agent_acknowledgment_name }
      - "optional_agent_signature": ${ optional_agent[0].signature_if_final(i) }
      - "optional_agent_printed_name": ${ optional_agent_printed_name }
      - "optional_agent_phone_number": ${ optional_agent[0].phone_number }
      - "optional_agent_date": ${ optional_agent_date.format() }
      - "nonappointing_parent_name": ${ nonappointing_parent[0] }
      - "nonappointing_parent_address": ${ nonappointing_parent_address }
      - "nonappointing_temp_agent": ${ nonappointing_temp_agent }
      - "nonappointing_optional_agent": ${ nonappointing_optional_agent }
      - "nonappointing_parent_signature": ${ nonappointing_parent[0].signature_if_final(i) }
      - "nonappointing_date": ${ nonappointing_date.format() }
      - "nonappointing_parent_printed_name": ${ nonappointing_parent_printed_name }
      - "nonappointing_phone_number": ${ nonappointing[0].phone_number }
---
objects:
  - temporary_agent_espwithfields_next_steps: ALDocument.using(filename="temporary_agent_espwithfields_next_steps", title=str(temporary_agent_espwithfields_next_steps_attachment_title), enabled=True, has_addendum=False)
