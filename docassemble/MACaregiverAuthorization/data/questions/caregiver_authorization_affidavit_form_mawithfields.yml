  - "County of notarization": notarization_county
  - "Date of notarization": notary_date
    datatype: date
  - "Name of user for notarization": users1_name_notarized
  - "Method of notary identification": notary_identification_method
  - "Expiration of notary commission": notary_commission_expiration
  - "Notary commission expiration date": notary_commission_expires_date
    datatype: date
---

id: CAREGIVER ACKNOWLEDGMENT
