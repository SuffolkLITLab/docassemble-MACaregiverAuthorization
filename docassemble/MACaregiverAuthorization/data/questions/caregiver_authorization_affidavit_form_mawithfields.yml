    datatype: yesno
  - "First witness's residential address": witnesses1_address
  - "First witness's address line 2": witnesses1_address_line2
  - "Second witness's residential address": witnesses2_address
  - "Second witness's address line 2": witnesses2_address_line2
---

id: NOTARIZATION DETAILS
