event: caregiver_authorization_affidavit_form_mawithfields_download
question: |
  All done
subquestion: |
  Thank you ${users}. Your form is ready to download and deliver.

  Use the options on this page to view, download and send your form. Use the
  "Edit answers" button to fix any mistakes.

  ${ action_button_html(url_action('review_caregiver_authorization_affidavit_form_mawithfields'), label=word('Edit answers'), color='info') }

  ${ al_user_bundle.download_list_html() }

  ${ al_user_bundle.send_button_html(show_editable_checkbox=False) }

progress: 100
---

# ALDocument objects specify the metadata for each template
objects:
  - caregiver_authorization_affidavit_form_mawithfields_Post_interview_instructions: ALDocument.using(filename="caregiver_authorization_affidavit_form_mawithfields_next_steps.docx", enabled=al_next_steps_enabled, has_addendum=False)
  - caregiver_authorization_affidavit_form_mawithfields_attachment: ALDocument.using(filename="caregiver_authorization_affidavit_form_mawithfields", enabled=True, has_addendum=False)
---

# Bundles group the ALDocuments into separate downloads, such as for court and for the user
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[caregiver_authorization_affidavit_form_mawithfields_Post_interview_instructions, caregiver_authorization_affidavit_form_mawithfields_attachment], filename="caregiver_authorization_affidavit_form_mawithfields", enabled=True)
  - al_court_bundle: ALDocumentBundle.using(elements=[caregiver_authorization_affidavit_form_mawithfields_attachment], filename="caregiver_authorization_affidavit_form_mawithfields", enabled=True)
---

template: caregiver_authorization_affidavit_form_mawithfields_Post_interview_instructions.title
content: |
  Instructions
---

template: caregiver_authorization_affidavit_form_mawithfields_attachment.title
content: |
  Caregiver authorization affidavit form MA-with-fields
---

template: al_user_bundle.title
content: |
  All forms to download for your records
---

template: al_court_bundle.title
content: |
  All forms to deliver to court
---

# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the
# same template is used for "preview" and "final" keys, and logic in the template checks
# the value of `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: caregiver_authorization_affidavit_form_mawithfields_next_steps
  docx template file: caregiver_authorization_affidavit_form_mawithfields_next_steps.docx
  variable name: caregiver_authorization_affidavit_form_mawithfields_Post_interview_instructions[i]
  skip undefined: True
  tagged pdf: True
---

attachment:
  name: caregiver authorization affidavit form mawithfields
  filename: caregiver_authorization_affidavit_form_mawithfields
  variable name: caregiver_authorization_affidavit_form_mawithfields_attachment[i]
  skip undefined: True
  pdf template file: caregiver_authorization_affidavit_form_MA-with-fields.pdf
  fields:
      - "users1_name_full": ${ users[0] }
      - "users1_full_address": ${ users1_full_address }
      - "users1_authorization_to_caregivers_name": ${ users1_authorization_to_caregivers_name }
      - "caregivers_full_address": ${ caregivers_full_address }
      - "childrens1_date_of_birth": ${ childrens1_date_of_birth }
      - "childrens1_name": ${ childrens1_name }
      - "childrens2_name": ${ childrens2_name }
      - "childrens2_date_of_birth": ${ childrens2_date_of_birth }
      - "childrens3_name": ${ childrens3_name }
      - "childrens3_date_of_birth": ${ childrens3_date_of_birth }
      - "childrens4_name": ${ childrens4_name }
      - "childrens4_date_of_birth": ${ childrens4_date_of_birth }
      - "caregivers_prohibited_acts": ${ caregivers_prohibited_acts }
      - "authorization_expiration_date": ${ authorization_expiration_date.format() }
      - "users1_signature": ${ users[0].signature_if_final(i) }
      - "users1_printed_name": ${ users1_printed_name }
      - "users1_telephone_number": ${ users1_telephone_number }
      - "witnesses_required": ${ witnesses_required }
      - "witnesses1_signature": ${ witnesses[0].signature_if_final(i) }
      - "witnesses2_signature": ${ witnesses[1].signature_if_final(i) }
      - "witnesses1_name": ${ witnesses[0] }
      - "witnesses2_name": ${ witnesses[1] }
      - "witnesses1_address": ${ witnesses1_address }
      - "witnesses2_address": ${ witnesses2_address }
      - "witnesses1_address_line2": ${ witnesses1_address_line2 }
      - "witnesses2_address_line2": ${ witnesses2_address_line2 }
      - "witnesses1_phone_number": ${ witnesses[0].phone_number }
      - "witnesses2_phone_number": ${ witnesses[1].phone_number }
      - "notarization_state": ${ notarization_state }
      - "notarization_county": ${ notarization_county }
      - "notary_date": ${ notary_date.format() }
      - "users1_name_notarized": ${ users1_name_notarized }
      - "notary_identification_method": ${ notary_identification_method }
      - "notary_signature": ${ notary[0].signature_if_final(i) }
      - "notary_name": ${ notary[0] }
      - "notary_commission_expiration": ${ notary_commission_expiration }
      - "notary_commission_expires_date": ${ notary_commission_expires_date.format() }
      - "caregivers_acknowledgment_printed_name": ${ caregivers_acknowledgment_printed_name }
      - "caregivers_acknowledgment_printed_name__1": ${ caregivers_acknowledgment_printed_name }
      - "caregivers_acknowledgment_address": ${ caregivers_acknowledgment_address }
      - "caregivers_relationship": ${ caregivers_relationship }
      # It's a signature: test which file version this is; leave empty unless it's the final version)
      - "caregivers_acknowledgement_signature": ${ caregivers_acknowledgement_signature if i == "final" else '' }
      - "caregivers_telephone_number": ${ caregivers_telephone_number }
      - "caregivers_acknowledgment_date": ${ caregivers_acknowledgment_date.format() }