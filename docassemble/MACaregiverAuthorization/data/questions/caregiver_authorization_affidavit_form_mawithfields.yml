id: notary names
sets:
  - notary[i].name.first
  - notary[i].name.last
  - notary[i].name.middle
  - notary[i].name.suffix
question: |
  % if hasattr(notary, 'ask_number') and notary.ask_number and notary.target_number == 1:
  Name of notary
  % else:
  Name of the ${ ordinal(i) } notary
  % endif
fields:
  - code: |
      notary[i].name_fields()
---

id: users names
sets:
  - users[i].name.first
  - users[i].name.last
  - users[i].name.middle
  - users[i].name.suffix
question: |
  % if i == 0 and al_person_answering == "user":
  What is your name?
  % elif al_form_type in ['starts_case', 'existing_case', 'appeal']:
  Who is the ${ ordinal(i) } person on your side of the case?
  % else:
  What is the name of the ${ ordinal(i) } person who is adding their
  name to this form with you?
  % endif
fields:
  - code: |
      users[i].name_fields()
---

id: witnesses names
sets:
  - witnesses[i].name.first
  - witnesses[i].name.last
  - witnesses[i].name.middle
  - witnesses[i].name.suffix
question: |
  % if hasattr(witnesses, 'ask_number') and witnesses.ask_number and witnesses.target_number == 1:
  Name of witness
  % else:
  Name of the ${ ordinal(i) } witness
  % endif
fields:
  - code: |
      witnesses[i].name_fields()
---

