id: Caregiver authorization affidavit form MA with fields intro
continue button field: caregiver_authorization_affidavit_form_mawithfields_intro
question: |
  Caregiver authorization affidavit form MA-with-fields
subquestion: |
  ### Before you get started
  - Ensure you have the necessary information about the caregiver and the minor child(ren).
  - Review any existing legal documents that may affect your ability to authorize a caregiver.

  ### When you are finished
  - Sign the affidavit in the presence of witnesses and a notary public.
  - Provide a copy of the completed affidavit to the caregiver and keep a copy for your records.

  Use this form if you are a parent or legal guardian looking to give a caregiver temporary rights concerning your child's education and health care. Make sure there are no existing court orders that would prevent you from doing so.
---

id: AUTHORIZING PARTY INFORMATION
question: |
  AUTHORIZING PARTY INFORMATION
subquestion: |
  Please provide your information.
fields:
  - "User's full residential address": users1_full_address
  - "User's printed name": users1_printed_name
  - "User's contact telephone number": users1_telephone_number
---

id: AUTHORIZED CAREGIVER DETAILS
question: |
  AUTHORIZED CAREGIVER DETAILS
subquestion: |
  Enter the information about the caregiver you are authorizing.
fields:
  - "Authorized caregiver's name": users1_authorization_to_caregivers_name
  - "Caregiver's full residential address": caregivers_full_address
  - "Caregiver's relationship to child": caregivers_relationship
---

id: first child name
question: |
  What is the first child's name?
fields:
  - "First child's name": childrens1_name
---

id: first child date of birth
question: |
  What is the first child's date of birth?
fields:
  - "First child's date of birth": childrens1_date_of_birth
    datatype: date
---

id: another child
question: |
  Do you have another child to add?
fields:
  - "": another_child
    datatype: yesnoradio
---

id: second child name
