content: |
  Instructions
---
template: temporary_agent_esp_attachment_title
content: |
  Temporary Agent Esp
---
template: al_user_bundle_title
content: |
  All forms to download for your records
---
template: al_recipient_bundle_title
content: |
  All forms to file
---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the
# same template is used for "preview" and "final" keys, and logic in the template checks
# the value of `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: temporary_agent_esp_next_steps
  docx template file: temporary_agent_esp_next_steps.docx
  variable name: temporary_agent_esp_Post_interview_instructions[i]
  skip undefined: True
  tagged pdf: True
---
attachment:
  name: temporary agent esp
  filename: temporary_agent_esp
  variable name: temporary_agent_esp_attachment[i]
  skip undefined: True
  pdf template file: Temporary_Agent_Esp.pdf
  fields:
      # ---------- Page 1 ----------
      - "user1_name": ${ users[0] }
      - "user1_address": ${ users[0].address.on_one_line() }
      - "user1_status_parent": ${ 'Yes' if user1_status_to_child == 'parent' else 'Off' }
      - "user1_status_legal_guardian": ${ 'Yes' if user1_status_to_child == 'legal guardian' else 'Off' }
      - "user1_status_legal_custodian": ${ 'Yes' if user1_status_to_child == 'legal custodian' else 'Off' }
      - "temp_agent": ${ temp_agent }
      - "temp_agent_address": ${ temp_agent.address.on_one_line() }
      - "child1_name": ${ children[0] if len(children) > 0 else '' }
      - "child1_birth_date": ${ children[0].birthdate.format() if len(children) > 0 else '' }
      - "child2_name": ${ children[1] if len(children) > 1 else '' }
      - "child2_birth_date": ${ children[1].birthdate.format() if len(children) > 1 else '' }
      - "child3_name": ${ children[2] if len(children) > 2 else '' }
      - "child3_birth_date": ${ children[2].birthdate.format() if len(children) > 2 else '' }
      - "child4_name": ${ children[3] if len(children) > 3 else '' }
      - "child4_birth_date": ${ children[3].birthdate.format() if len(children) > 3 else '' }
      - "prohibitive_acts": ${ showifdef('temp_agent_prohibitive_acts') }
      - "optional_agent": ${ optional_agent if want_optional_agent else '' }
      - "optional_agent_address": ${ optional_agent.address.on_one_line() if want_optional_agent else '' }
      # ---------- Page 2 ----------
      - "non_appointing_parent_has_given_consent": ${ 'Yes' if nonappointing_parent_consent else 'Off' }
      - "non_appointing_parent_has_not_given_consent": ${ 'Off' if nonappointing_parent_consent else 'Yes' }
      - "non_appointing_parent_deceased": ${ 'Yes' if (not nonappointing_parent_consent and nonappointing_parent_status == 'deceased') else 'Off' }
      - "non_appointing_parent_whereabouts_unknown": ${ 'Yes' if (not nonappointing_parent_consent and nonappointing_parent_status == 'whereabouts unknown') else 'Off' }
      - "non_appointing_parent_unwilling": ${ 'Yes' if (not nonappointing_parent_consent and nonappointing_parent_status == 'unwilling') else 'Off' }
      - "non_appointing_parent_unable": ${ 'Yes' if (not nonappointing_parent_consent and nonappointing_parent_status == 'unable') else 'Off' }
      # ---------- Page 3 ----------
      - "user1_printed_name": ${ users[0] }
      - "user1_phone_number": ${ users[0].phone_number }
      - "user1_signature": ${ users[0].signature_if_final(i) }
      - "temp_agent_acknowledgement": ${ showifdef('temp_agent_printed_name') }
      # ---------- Page 4 ----------
      - "temp_agent_printed_name": ${ showifdef('temp_agent_printed_name') }
      - "temp_agent_phone_number": ${ temp_agent.phone_number if defined('temp_agent.phone_number') else '' }
      - "temp_agent_date": ${ temp_agent_date.format() if defined('temp_agent_date') else '' }
      - "temp_agent_signature": ${ temp_agent.signature_if_final(i) if defined('temp_agent.signature') else '' }
      - "optional_agent_name_acknowledgment": ${ showifdef('optional_agent_printed_name') }
      # ---------- Page 5 ----------
      - "optional_agent_printed_name": ${ showifdef('optional_agent_printed_name') }
      - "optional_agent_phone_number": ${ optional_agent.phone_number if defined('optional_agent.phone_number') else '' }
      - "optional_agent_date": ${ optional_agent_date.format() if defined('optional_agent_date') else '' }
      - "optional_agent_signature": ${ optional_agent.signature_if_final(i) if defined('optional_agent.signature') else '' }
      - "other_parent": ${ nonappointing_parent if nonappointing_parent_consent else '' }
      - "other_parent_address": ${ nonappointing_parent.address.on_one_line() if nonappointing_parent_consent else '' }
      - "other_temp_agent_name": ${ showifdef('nonappointing_temp_agent') }
      - "other_optional_agent_name": ${ showifdef('nonappointing_optional_agent') }
      - "other_parent_name": ${ nonappointing_parent if nonappointing_parent_consent else '' }
      - "other_parent_phone_number": ${ nonappointing_parent.phone_number if nonappointing_parent_consent else '' }
