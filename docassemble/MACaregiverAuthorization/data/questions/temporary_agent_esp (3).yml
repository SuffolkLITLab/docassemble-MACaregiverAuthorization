---
objects:
  - users: ALPeopleList.using(ask_number=True, target_number=1)
  - children: ALPeopleList.using(there_are_any=True)
  - temp_agent: ALIndividual
  - optional_agent: ALIndividual
  - nonappointing_parent: ALIndividual
---
sections:
  - appointing_party: Appointing Party
  - agents_and_contacts: Agents & Contacts
  - children_and_consent: Children & Consent
