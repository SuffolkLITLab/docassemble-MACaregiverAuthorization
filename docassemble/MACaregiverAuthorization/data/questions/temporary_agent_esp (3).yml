  - review_and_sign: Review & Sign
  - review_temporary_agent_esp: Review your answers
---
#################### Interview order #####################
id: interview_order_temporary_agent_esp
mandatory: True
code: |
  al_intro_screen
  temporary_agent_esp_intro

  # 1. Appointing party: name, address, parent status
  nav.set_section("appointing_party")
  users.gather()
  users[0].name.first
  user1_status_to_child

  # 2. Children: name + birth date, then "another child?" (asked at most 3 times)
  nav.set_section("children_and_consent")
  children.gather()

  # 3. Temporary agent, then optional agent
  nav.set_section("agents_and_contacts")
  temp_agent.name.first
  want_optional_agent
  if want_optional_agent:
    optional_agent.name.first

  # 4. Prohibited acts
  nav.set_section("limitations")
  set_progress(36)
  temp_agent_prohibitive_acts

  # 5. Other parent's consent
  nav.set_section("children_and_consent")
  nonappointing_parent_consent
  if nonappointing_parent_consent:
    nonappointing_parent.name.first
    nonappointing_temp_agent
    if want_optional_agent:
      nonappointing_optional_agent
  else:
    nonappointing_parent_status

  # 6. Are the agents with you? Acknowledgments + signatures
  nav.set_section("review_and_sign")
  parties_available
  if parties_available:
    temp_agent_printed_name
    temp_agent.signature
    if want_optional_agent:
      optional_agent_available
      if optional_agent_available:
        optional_agent_printed_name
        optional_agent.signature

  # 7. Preview, then the appointing party signs
  temporary_agent_esp_preview_question
  users[0].signature

  store_variables_snapshot(
      persistent=True,
      data={
          "zip": showifdef("users[0].address.zip"),
          "reached_interview_end": True,
      },
  )
  set_progress(100)
  temporary_agent_esp_download
---
id: temporary_agent_authorization
continue button field: temporary_agent_esp_intro
question: "Temporary Agent Authorization"
subquestion: |2-
  ### Why should I fill out a Temporary Agent Authorization?
  * A Temporary Agent Authorization gives a caregiver the power and responsibility
    to make decisions for your child's healthcare, education, property and finances.
  * The Agent cannot give permission for your child to marry or be adopted.
  * The authorization gives the agent the power to make decisions in your child’s life for up to 60 days after you are detained or unavailable.
  * You have the right to end the authorization at any time.
  * After 60 days, you can renew the authorization, but you must complete a new form.

  ### Before you get started
  - Ensure you have the names and birthdates of the children involved.
  - Decide who you want to appoint as the temporary agent.
  - You do not have to put all your children on one form. You can fill out a form for each child. Each child needs their own form if they have different caregivers or parents.

  ### What you will need
  * You will need 2 witnesses to sign the form with you.
  * The agent must sign the form.
  * You can add a second person to the form, in case the person you picked to be Temporary Agent is not available.
  * You may need the other parent of your child to sign the form if you know where they are and if they are able and willing to provide care.

  ### When you are finished
  - Sign the form in the presence of witnesses.
  - Provide a copy to the appointed agent and keep one for your records.

  If you are a parent or legal guardian and need someone to make decisions for your child temporarily, this form is for you. It allows you to appoint a trusted individual to act on your behalf in specific situations.
---
id: appointing party information
sets:
  - users[0].name.first
  - users[0].name.last
  - users[0].address.address
  - users[0].address.city
  - users[0].address.state
  - users[0].address.zip
  - users[0].phone_number
  - user1_status_to_child
question: |
  Your information
subquestion: |
  You are the "appointing party."
fields:
  - code: |
      users[0].name_fields()
  - code: |
      users[0].address_fields()
  - Phone number: users[0].phone_number
    datatype: al_international_phone
  - Your relationship to the child: user1_status_to_child
    datatype: dropdown
    choices:
      - Parent: parent
      - Legal guardian: legal guardian
      - Legal custodian: legal custodian
---
id: children names and birth dates
sets:
  - children[i].name.first
  - children[i].name.last
  - children[i].name.middle
  - children[i].name.suffix
  - children[i].birthdate
question: |
  % if i == 0:
  Tell us about your child
  % else:
  Tell us about your ${ ordinal(i) } child
  % endif
fields:
  - code: |
      children[i].name_fields()
  - Birth date: children[i].birthdate
    datatype: date
---
id: another child
question: |
  Do you have another child to add?
yesno: children.there_is_another
---
# Must come AFTER the question above. The PDF has room for 4 children, so
# "another child?" is asked after child 1, 2 and 3 only (3 times in total).
code: |
  if len(children) >= 4:
    children.there_is_another = False
---
id: temporary agent info
sets:
  - temp_agent.name.first
  - temp_agent.name.last
  - temp_agent.address.address
  - temp_agent.address.city
  - temp_agent.address.state
  - temp_agent.address.zip
question: |
  Who is your temporary agent?
fields:
  - code: |
      temp_agent.name_fields()
  - code: |
      temp_agent.address_fields()
---
id: want optional agent
question: |
  Do you want to name an optional (backup) agent?
subquestion: |
  This person can act if your temporary agent is not available.
yesno: want_optional_agent
---
id: optional agent info
sets:
  - optional_agent.name.first
  - optional_agent.name.last
  - optional_agent.address.address
  - optional_agent.address.city
  - optional_agent.address.state
  - optional_agent.address.zip
question: |
  Who is your optional agent?
fields:
  - code: |
      optional_agent.name_fields()
  - code: |
      optional_agent.address_fields()
---
id: prohibited acts
question: |
  Prohibited acts
subquestion: |
  List any acts your agent is NOT allowed to do.
fields:
  - Prohibited acts: temp_agent_prohibitive_acts
    input type: area
    required: False
---
id: nonappointing parent consent
question: |
  Has the other parent given consent?
yesno: nonappointing_parent_consent
---
id: nonappointing parent status
question: |
  Why was the other parent's consent not obtained?
subquestion: |
  The other parent does not have to consent if one of these is true.
field: nonappointing_parent_status
choices:
  - Deceased: deceased
  - Whereabouts unknown: whereabouts unknown
  - Unwilling to provide care for the child: unwilling
  - Unable to provide care for the child: unable
---
id: nonappointing parent info
sets:
  - nonappointing_parent.name.first
  - nonappointing_parent.name.last
  - nonappointing_parent.address.address
  - nonappointing_parent.address.city
  - nonappointing_parent.address.state
  - nonappointing_parent.address.zip
  - nonappointing_parent.phone_number
question: |
  Other parent's information
fields:
  - code: |
      nonappointing_parent.name_fields()
  - code: |
      nonappointing_parent.address_fields()
  - Phone number: nonappointing_parent.phone_number
    datatype: al_international_phone
---
id: nonappointing temp agent
question: |
  Who does the other parent designate as temporary agent?
fields:
  - Temporary agent: nonappointing_temp_agent
    default: ${ temp_agent }
---
id: nonappointing optional agent
question: |
  Who does the other parent designate as optional agent?
fields:
  - Optional agent: nonappointing_optional_agent
    default: ${ optional_agent }
---
id: parties available
question: |
  Are the people you named with you right now?
subquestion: |
  If they are, they can fill in their acknowledgment and sign on this device.
  If not, they can sign the printed form later.
yesno: parties_available
---
id: temp agent acknowledgment
question: |
  Temporary agent acknowledgment
subquestion: |
  Please hand the device to ${ temp_agent }.
fields:
  - Printed name: temp_agent_printed_name
    default: ${ temp_agent }
  - Phone number: temp_agent.phone_number
    datatype: al_international_phone
  - Date: temp_agent_date
    datatype: date
    default: ${ today() }
---
id: temp agent signature
question: |
  Temporary agent signature
signature: temp_agent.signature
under: |
  ${ temp_agent_printed_name }
---
id: optional agent available
question: |
  Is the optional agent with you right now?
yesno: optional_agent_available
---
id: optional agent acknowledgment
question: |
  Optional agent acknowledgment
subquestion: |
  Please hand the device to ${ optional_agent }.
fields:
  - Printed name: optional_agent_printed_name
    default: ${ optional_agent }
  - Phone number: optional_agent.phone_number
    datatype: al_international_phone
  - Date: optional_agent_date
    datatype: date
    default: ${ today() }
---
id: optional agent signature
question: |
  Optional agent signature
signature: optional_agent.signature
under: |
  ${ optional_agent_printed_name }
---
id: appointing party signature
question: |
  Sign your form
signature: users[0].signature
under: |
  ${ users[0] }
---
id: preview temporary_agent_esp
question: |
  Preview your form before you sign it
subquestion: |
  Here is a preview of the form you will sign on the next page.

  ${ al_recipient_bundle.as_pdf(key='preview') }

  Open the form preview in a new tab. Use the "Edit answers" button to edit your
  answers.

  ${ action_button_html(url_action('review_temporary_agent_esp'), label=word('Edit answers'), color='info') }

  Return to this interview tab to continue and sign your form.
continue button field: temporary_agent_esp_preview_question
---
id: temporary agent esp review screen
event: review_temporary_agent_esp
question: |
  Review your answers
review:
  - Edit: users[0].name.first
    button: |
      **Your information**

      ${ users[0] }, ${ users[0].address.on_one_line() }

      Relationship to child: ${ showifdef('user1_status_to_child') }
  - Edit: children.revisit
    button: |
      **Children**

      % for item in children:
        * ${ item }, born ${ showifdef('item.birthdate') }
      % endfor
  - Edit: temp_agent.name.first
    button: |
      **Temporary agent**

      ${ temp_agent }, ${ temp_agent.address.on_one_line() }
  - Edit: want_optional_agent
    button: |
      **Optional agent**

      % if want_optional_agent:
      ${ optional_agent }, ${ optional_agent.address.on_one_line() }
      % else:
      None
      % endif
  - Edit: temp_agent_prohibitive_acts
    button: |
      **Prohibited acts**

      ${ single_paragraph(temp_agent_prohibitive_acts) if defined('temp_agent_prohibitive_acts') else '' }
  - Edit: nonappointing_parent_consent
    button: |
      **Other parent consent**

      Consent given: ${ yesno(nonappointing_parent_consent) }
---
id: edit children
continue button field: children.revisit
question: |
  Edit children
subquestion: |
  ${ children.table }

  ${ children.add_action() }
---
table: children.table
rows: children
columns:
  - Name: |
      row_item.name_full() if defined("row_item.name.first") else ""
  - Birth date: |
      row_item.birthdate.format() if defined("row_item.birthdate") else ""
edit:
  - name.first
  - birthdate
confirm: True
---
id: download temporary_agent_esp
event: temporary_agent_esp_download
question: |
  All done
subquestion: |
  % if defined("users[0]"):
  Thank you ${ users }. Your form is ready to download and deliver.
  % else:
  Thank you. Your form is ready to download and deliver.
  % endif

  Use the options on this page to view, download and send your form. Use the
  "Edit answers" button to fix any mistakes.

  ${ action_button_html(url_action('review_temporary_agent_esp'), label=word('Edit answers'), color='info') }

  ${ al_user_bundle.download_list_html() }

  ${ al_user_bundle.send_button_html(show_editable_checkbox=False) }

progress: 100
---
# ALDocument objects specify the metadata for each template
objects:
  - temporary_agent_esp_Post_interview_instructions: ALDocument.using(filename="temporary_agent_esp_next_steps.docx", title=str(temporary_agent_esp_Post_interview_instructions_title), enabled=True, has_addendum=False)
  - temporary_agent_esp_attachment: ALDocument.using(filename="temporary_agent_esp", title=str(temporary_agent_esp_attachment_title), enabled=True, has_addendum=False)
---
# Bundles group the ALDocuments into separate downloads, such as for court and for the user
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[temporary_agent_esp_Post_interview_instructions, temporary_agent_esp_attachment, Temporary_Agent_Esp_2, temporary_agent_esp_2_next_steps], filename="temporary_agent_esp", enabled=True, title=str(al_user_bundle_title))
  - al_recipient_bundle: ALDocumentBundle.using(elements=[temporary_agent_esp_attachment, Temporary_Agent_Esp_2, temporary_agent_esp_2_next_steps], filename="temporary_agent_esp", enabled=True, title=str(al_recipient_bundle_title))
