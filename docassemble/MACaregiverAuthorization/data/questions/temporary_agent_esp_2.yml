---
#################### Interview order #####################
comment: |
  Controls order and branching logic for questions specific to this form
id: interview_order_temporary_agent_esp_2
mandatory: True
code: |
  al_intro_screen
  temporary_agent_esp_2_intro
  nav.set_section("basic_info")
  users.gather()
  set_parts(subtitle=str(users))
  # Eligibility check 1: stop the form if parental rights were terminated or given away
  parental_rights_terminated_or_given_away
  if parental_rights_terminated_or_given_away:
    ineligible_to_complete_screen
  # Eligibility check 2: stop the form if a court order blocks giving these rights and duties
  court_order_blocks_giving_rights
  if court_order_blocks_giving_rights:
    ineligible_to_complete_screen
  parent_statements_screen
  # "Your Information" screen: address, phone and parental status
  user1_status
  # "The other parent" screens: consent, then name/address/phone/date
  # if they agreed, or the reason they did not agree.
  non_appointing_parent_has_given_consent
  non_appointing_parent_has_not_given_consent
  if non_appointing_parent_has_given_consent:
    other_parent_name
  else:
    non_appointing_parent
  set_progress(14)
  set_progress(22)
  # Are the agent(s) completing the form with the user?
  completing_form_with_agents
  if not completing_form_with_agents:
    agents_review_and_sign_later_screen
  # "Agent Details" screen: name, address, phone and (if completing together) date.
  temp_agent_printed_name
  # The PDF uses `skip undefined: True`, so any variable that is not already
  # defined when the PDF is built is silently left blank. These lines force the
  # copied-name variables to be defined first.
  temp_agent_acknowledgement
  other_temp_agent_name
  # Agent age check: agent must be 18 or older
  agent_is_18_or_older
  if not agent_is_18_or_older:
    agent_too_young_screen
  set_progress(35)
  prohibitive_acts
  set_progress(45)
  # Backup agent: only ask for the details if the user wants one
  add_backup_agent
  if add_backup_agent:
    # Is the backup agent completing the form with the user?
    completing_form_with_backup_agent
    if not completing_form_with_backup_agent:
      backup_agent_review_and_sign_later_screen
    optional_agent_printed_name
    optional_agent_name_acknowledgment
    other_optional_agent_name
    # Backup agent age check: must be 18 or older
    optional_agent_is_18_or_older
    if not optional_agent_is_18_or_older:
      agent_too_young_screen
  set_progress(55)
  children.gather()
  for child in children:
    child.birthdate
  set_progress(68)
  set_progress(81)
  # Store anonymous data for analytics / statistics
  store_variables_snapshot(
      persistent=True,
      data={
          "zip": showifdef("users[0].address.zip"),
          "reached_interview_end": True,
      },
  )
  temporary_agent_esp_2_preview_question
  nav.set_section("signatures")
  signature_instructions_screen
  set_progress(100)
  temporary_agent_esp_2_download
---
id: temporary_agent_form
continue button field: temporary_agent_esp_2_intro
question: "MA Temporary Agent Authorization Form"
subquestion: |2+
  ### Is this form right for you?
  - You can use this form if you are a parent, legal guardian, or legal custodian who needs someone to care for your child while you are unable to do so. Make sure the person you choose (the agent) understands and agrees to the responsibilities.
  - You may use this form if you expect to be temporarily unable to care for your child because of a medical procedure, illness, work-related travel, a family emergency, or fear of being separated from your child unexpectedly, such as during immigration enforcement.
  
  
  ### What do you need to complete this form?
  - You must complete this form while two witnesses watch.
  - Each witness must be at least 18, and your agent cannot be one of them.
  - Have your agent agree.
  - Get the other parent’s written permission if they are alive, easy to find, and able and willing to care for your child.
  
  ### When you are done
  - Have the form signed by witnesses and the chosen agent.
  - Have the form notarized.
  - Keep a copy for yourself and give copies to the chosen agent(s).
  
---
---
id: parental rights terminated or given away
question: |
  Have your parental rights been terminated or given away?
subquestion: |
  Answer **Yes** if a court ended (took away) your parental rights, or if you signed papers giving up your parental rights.
fields:
  - no label: parental_rights_terminated_or_given_away
    datatype: yesnoradio
---
id: court order blocks giving rights
question: |
  Is there a court order that says you cannot give these rights and duties to someone else?
fields:
  - no label: court_order_blocks_giving_rights
    datatype: yesnoradio
---
id: ineligible to complete screen
event: ineligible_to_complete_screen
question: |
  You are ineligible to complete this form.
buttons:
  - Exit: exit
---
id: parent statements
continue button field: parent_statements_screen
question: |
  Important information
subquestion: |2
  Please read the following statements:
  
  * If I change or cancel this affidavit, I must give a copy of the updated or canceled affidavit to everyone who received the original.
  * This document only takes effect if I am detained by law enforcement, deported from the United States, or my agent does not know where I am for 24 hours. Proof of this may include a government document showing my detention or deportation, a statement from my lawyer, or a statement from my agent.
  * This document stays in effect for 60 days after it takes effect, unless I change or cancel it in writing before then.
---
# Shared look for the small "?" help icons used on several screens. Each screen
# that shows a "?" repeats the css and script modifiers below.
id: Appointing Party Information
question: |2
  Your Information
subquestion: |
  Hover over or tap the **?** next to each choice to see what it means.
fields:
  - code: |
      users[0].address_fields(show_country=False)
  - Phone number: user1_phone_number
    datatype: al_international_phone
  - Parental Status: user1_status
    datatype: radio
    choices:
      - 'Parent <a tabindex="0" role="button" class="al-help-icon" aria-label="What does parent mean?" data-help="Someone who is legally a child&#39;s parent.">?</a>': parent
      - 'Legal guardian <a tabindex="0" role="button" class="al-help-icon" aria-label="What does legal guardian mean?" data-help="Someone a court appoints to care for a child and make decisions for them.">?</a>': legal_guardian
      - 'Legal custodian <a tabindex="0" role="button" class="al-help-icon" aria-label="What does legal custodian mean?" data-help="Someone who has been given the legal right to care for a child.">?</a>': legal_custodian
sets:
  - users[0].address.address
  - users[0].address.unit
  - users[0].address.city
  - users[0].address.state
  - users[0].address.zip
css: |
  <style>
    .al-help-icon { display:inline-block; width:1.4em; height:1.4em; line-height:1.3em; margin-left:.35em; text-align:center; font-size:.8em; font-weight:700; border:1px solid currentColor; border-radius:50%; cursor:help; text-decoration:none; vertical-align:middle; }
  </style>
script: |
  <script>
    $(document).on('daPageLoad', function(){
      $('.al-help-icon').each(function(){
        $(this).popover({trigger: 'hover focus', placement: 'top', container: 'body', content: $(this).attr('data-help')});
        $(this).on('click', function(e){ e.preventDefault(); e.stopPropagation(); });
      });
    });
  </script>
---
# Plain-English label for the radio answer (used on the review screen).
reconsider: True
code: |
  user1_status_label = {
    'parent': 'Parent',
    'legal_guardian': 'Legal guardian',
    'legal_custodian': 'Legal custodian',
  }.get(user1_status, '')
---
id: Non Appointing Parent Consent
question: |
  Did the other parent agree to you choosing an agent?
subquestion: |
  If you know who your child’s other parent is, tell us if that parent agreed to the agent or agents.
fields:
  - no label: non_appointing_parent_has_given_consent
    datatype: yesnoradio
---
# The PDF has a separate box for "has not given consent". It is always the
# opposite of the answer above, so it is filled in automatically.
reconsider: True
code: |
  non_appointing_parent_has_not_given_consent = not non_appointing_parent_has_given_consent
---
id: Other Parent Details
question: |
  The other parent
subquestion: |2
  Write the other parent’s information here. (This section does not need to be completed before a notary.)
fields:
  - Name: other_parent_name
  - code: |
      other_parent.address_fields(show_country=False)
  - Phone number: other_parent_phone_number
    datatype: al_international_phone
  - Date: other_parent_date
    datatype: date
sets:
  - other_parent.address.address
  - other_parent.address.unit
  - other_parent.address.city
  - other_parent.address.state
  - other_parent.address.zip
---
id: Other Parent No Consent Reason
question: |
  Why did the other parent not agree?
subquestion: |
  Check the box that tells why.
fields:
  - Reason why consent was not received: non_appointing_parent
    datatype: checkboxes
    choices:
      - {"Deceased":"deceased"}
      - {"Whereabouts unknown":"whereabouts_unknown"}
      - {"Unwilling":"unwilling"}
      - {"Unable":"unable"}
---
# Gives the other_parent person a name (used on the signature page).
reconsider: True
code: |
  _other_parent_parts = (other_parent_name or '').strip().rsplit(' ', 1)
  other_parent.name.first = _other_parent_parts[0]
  other_parent.name.middle = ''
  other_parent.name.last = _other_parent_parts[1] if len(_other_parent_parts) > 1 else ''
  other_parent.name.suffix = ''
---
id: completing form with agents
question: |
  Are you completing this form together with your agent(s)?
subquestion: |
  Hover over or tap the **?** to see who each person is.

  * You (the appointing party) <a tabindex="0" role="button" class="al-help-icon" aria-label="Who is the appointing party?" data-help="The parent, legal guardian, or legal custodian who is choosing someone to care for the child.">?</a>
  * Temporary agent <a tabindex="0" role="button" class="al-help-icon" aria-label="Who is the temporary agent?" data-help="The person you choose to care for your child and make decisions for your child while you are unable to.">?</a>
  * Backup agent (optional) <a tabindex="0" role="button" class="al-help-icon" aria-label="Who is the backup agent?" data-help="A backup person who can care for your child if the first person you choose is unavailable.">?</a>
fields:
  - no label: completing_form_with_agents
    datatype: yesnoradio
css: |
  <style>
    .al-help-icon { display:inline-block; width:1.4em; height:1.4em; line-height:1.3em; margin-left:.35em; text-align:center; font-size:.8em; font-weight:700; border:1px solid currentColor; border-radius:50%; cursor:help; text-decoration:none; vertical-align:middle; }
  </style>
script: |
  <script>
    $(document).on('daPageLoad', function(){
      $('.al-help-icon').each(function(){
        $(this).popover({trigger: 'hover focus', placement: 'top', container: 'body', content: $(this).attr('data-help')});
        $(this).on('click', function(e){ e.preventDefault(); e.stopPropagation(); });
      });
    });
  </script>
---
id: agents review and sign later
continue button field: agents_review_and_sign_later_screen
question: |
  Important information
subquestion: |
  Please have the agent(s) review, date, and sign the form in front of the witnesses and notary.
---
id: Temporary Agent Details
question: |
  Agent Details
subquestion: |
  Write the name and address of the person you want to take care of your child or children. This person is called “the agent.” The agent can make any decision for your children that you could make.
fields:
  - Name: temp_agent_printed_name
  - code: |
      temp_agent.address_fields(show_country=False)
  - Phone number: temp_agent_phone_number
    datatype: al_international_phone
  # The date only appears if the agent(s) are completing the form with the user.
  - code: |
      [{'label': 'Acknowledgment date', 'field': 'temp_agent_date', 'datatype': 'date'}] if completing_form_with_agents else []
sets:
  - temp_agent.address.address
  - temp_agent.address.unit
  - temp_agent.address.city
  - temp_agent.address.state
  - temp_agent.address.zip
---
# The agent's name is typed once, above. These copy it to every other place the
# form needs it, and give the temp_agent person a name for the signature page.
# `reconsider: True` keeps the copies in sync if the name is edited later.
reconsider: True
code: |
  temp_agent_acknowledgement = temp_agent_printed_name
  other_temp_agent_name = temp_agent_printed_name
  _temp_agent_parts = temp_agent_printed_name.strip().rsplit(' ', 1)
  temp_agent.name.first = _temp_agent_parts[0]
  temp_agent.name.middle = ''
  temp_agent.name.last = _temp_agent_parts[1] if len(_temp_agent_parts) > 1 else ''
  temp_agent.name.suffix = ''
---
id: agent statements
question: |
  Is ${ temp_agent_printed_name } 18 years old or older?
fields:
  - no label: agent_is_18_or_older
    datatype: yesnoradio
---
id: agent too young screen
event: agent_too_young_screen
question: |
  Agent is too young
subquestion: |
  Agents must be 18 years or older to be appointed. Please provide an agent 18 years or older.

buttons:
  - Exit: exit
---
id: undo agent age
event: undo_agent_age
code: |
  undefine('agent_is_18_or_older')
  response(command='refresh')
---
id: Not allowed Acts
question: |
  Not allowed Acts
subquestion: |2
  Write down anything you don’t want the agent to do.
fields:
  - label: Acts not allowed for agent
    field: prohibitive_acts
    datatype: area
    required: False
---
id: add backup agent
question: |
  Would you like to add a backup agent?
subquestion: |
  What is a backup agent? <a tabindex="0" role="button" class="al-help-icon" aria-label="What is a backup agent?" data-help="The optional temporary agent is a backup person who can care for your child if the first person you choose is unavailable. The backup agent must agree that he or she cannot act for you until you are detained or missing.">?</a>
fields:
  - no label: add_backup_agent
    datatype: yesnoradio
css: |
  <style>
    .al-help-icon { display:inline-block; width:1.4em; height:1.4em; line-height:1.3em; margin-left:.35em; text-align:center; font-size:.8em; font-weight:700; border:1px solid currentColor; border-radius:50%; cursor:help; text-decoration:none; vertical-align:middle; }
  </style>
script: |
  <script>
    $(document).on('daPageLoad', function(){
      $('.al-help-icon').each(function(){
        $(this).popover({trigger: 'hover focus', placement: 'top', container: 'body', content: $(this).attr('data-help')});
        $(this).on('click', function(e){ e.preventDefault(); e.stopPropagation(); });
      });
    });
  </script>
---
id: completing form with backup agent
question: |
  Are you completing this form together with your backup agent?
fields:
  - no label: completing_form_with_backup_agent
    datatype: yesnoradio
---
id: backup agent review and sign later
continue button field: backup_agent_review_and_sign_later_screen
question: |
  Important information
subquestion: |
  Please have the agent(s) review, date, and sign the form in front of the witnesses and notary.
---
id: Alternate Agent Information
question: |2
  Backup Agent
subquestion: |
  Write the backup agent’s name, address, and phone number here. The backup agent must agree that he or she cannot act for you until you are detained or missing.
fields:
  - label: Name
    field: optional_agent_printed_name
  - code: |
      optional_agent.address_fields(show_country=False)
  - label: Phone number
    field: optional_agent_phone_number
    datatype: al_international_phone
  # The date only appears if the backup agent is completing the form with the user.
  - code: |
      [{'label': 'Acknowledgment date', 'field': 'optional_agent_date', 'datatype': 'date'}] if completing_form_with_backup_agent else []
sets:
  - optional_agent.address.address
  - optional_agent.address.unit
  - optional_agent.address.city
  - optional_agent.address.state
  - optional_agent.address.zip
---
# Same idea for the backup agent: one typed name fills the rest.
reconsider: True
code: |
  optional_agent_name_acknowledgment = optional_agent_printed_name
  other_optional_agent_name = optional_agent_printed_name
  _optional_agent_parts = optional_agent_printed_name.strip().rsplit(' ', 1)
  optional_agent.name.first = _optional_agent_parts[0]
  optional_agent.name.middle = ''
  optional_agent.name.last = _optional_agent_parts[1] if len(_optional_agent_parts) > 1 else ''
  optional_agent.name.suffix = ''
---
id: backup agent age
question: |
  Is ${ optional_agent_printed_name } 18 years old or older?
fields:
  - no label: optional_agent_is_18_or_older
    datatype: yesnoradio
---
id: signature choice
continue button field: signature_instructions_screen
question: |
  Signing your form
subquestion: |
  This form should be signed in front of 2 witnesses, who cannot be your agent(s), and a notary.
---
id: preview temporary_agent_esp_2
question: |
  Preview your form
subquestion: |
  Here is a preview of your form.

  ${ al_recipient_bundle.as_pdf(key='preview') }

  Open the form preview in a new tab. Use the "Edit answers" button to edit your
  answers.

  ${ action_button_html(url_action('review_temporary_agent_esp_2'), label=word('Edit answers'), color='info') }

  Return to this interview tab to continue.
continue button field: temporary_agent_esp_2_preview_question
---
comment: |
  The questions below are copies of the questions in AssemblyLine's
  ql_baseline.yml, rewritten to name this interview's own objects instead of the
  generic `x`. Edit them freely: they replace the AssemblyLine versions. Delete
  one to go back to the AssemblyLine wording.
---
id: children names
sets:
  - children[i].name.first
  - children[i].name.last
  - children[i].name.middle
  - children[i].name.suffix
question: |
  % if hasattr(children, 'ask_number') and children.ask_number and children.target_number == 1:
  Name of child
  % else:
  Name of the ${ ordinal(i) } child
  % endif
fields:
  - code: |
      children[i].name_fields()
---
id: another child
question: |
  Is there another child to tell us about?
fields:
  - no label: children.there_is_another
    datatype: yesnoradio
---
id: users names
sets:
  - users[i].name.first
  - users[i].name.last
  - users[i].name.middle
  - users[i].name.suffix
question: |
  % if i == 0 and al_person_answering == "user":
  What is your name?
  % elif al_form_type in ['starts_case', 'existing_case', 'appeal']:
  Who is the ${ ordinal(i) } person on your side of the case?
  % else:
  What is the name of the ${ ordinal(i) } person who is adding their
  name to this form with you?
  % endif
fields:
  - code: |
      users[i].name_fields()
---
id: user phone number
question: |
  What is ${ users[i] }'s phone number?
fields:
  - Phone: users[i].phone_number
    datatype: al_international_phone
---
id: temporary agent esp 2 review screen
event: review_temporary_agent_esp_2
question: |
  Review your answers
review:
  - Edit: users.revisit
    button: |
      **Users**

      % for item in users:
        * ${ item }
      % endfor
  - Edit: user1_status
    button: |
      **Appointing Party Information**

      User1 home address: ${ users[0].address.on_one_line() if defined('users[0].address.address') else '' }

      User1 phone number: ${ showifdef('user1_phone_number') }

      User1 relationship status: ${ user1_status_label if defined('user1_status') else '' }
  - Edit: completing_form_with_agents
    button: |
      **Completing the form with your agent(s)**

      Completing the form with your agent(s): ${ word(yesno(completing_form_with_agents)) if defined('completing_form_with_agents') else '' }
  - Edit: temp_agent_printed_name
    button: |
      **Temporary Agent Details**

      Temporary agent printed name: ${ showifdef('temp_agent_printed_name') }

      Temporary agent home address: ${ temp_agent.address.on_one_line() if defined('temp_agent.address.address') else '' }

      Temporary agent phone number: ${ showifdef('temp_agent_phone_number') }

      Temporary agent appointment date: ${ showifdef('temp_agent_date') }
  - Edit: prohibitive_acts
    button: |
      **Not allowed Acts**

      Acts not allowed for agent: ${ single_paragraph(prohibitive_acts) if defined('prohibitive_acts') else '' }
  - Edit: add_backup_agent
    button: |
      **Backup Agent**

      Add a backup agent: ${ word(yesno(add_backup_agent)) if defined('add_backup_agent') else '' }
  - Edit: completing_form_with_backup_agent
    show if: add_backup_agent
    button: |
      **Completing the form with your backup agent**

      Completing the form with your backup agent: ${ word(yesno(completing_form_with_backup_agent)) if defined('completing_form_with_backup_agent') else '' }
  - Edit: optional_agent_printed_name
    show if: add_backup_agent
    button: |
      **Alternate Agent Information**

      Alternate agent printed name: ${ showifdef('optional_agent_printed_name') }

      Alternate agent home address: ${ optional_agent.address.on_one_line() if defined('optional_agent.address.address') else '' }

      Alternate agent phone number: ${ showifdef('optional_agent_phone_number') }

      Date of alternate agent appointment: ${ showifdef('optional_agent_date') }
  - Edit: non_appointing_parent_has_given_consent
    button: |
      **Non-Appointing Parent Consent**

      Consent from non-appointing parent: ${ word(yesno(non_appointing_parent_has_given_consent)) if defined('non_appointing_parent_has_given_consent') else '' }

      No consent from non-appointing parent: ${ word(yesno(non_appointing_parent_has_not_given_consent)) if defined('non_appointing_parent_has_not_given_consent') else '' }

      Non-appointing parent options: ${ showifdef('non_appointing_parent') }

      Name of other parent: ${ showifdef('other_parent_name') }

      Address of other parent: ${ other_parent.address.on_one_line() if defined('other_parent.address.address') else '' }

      Phone number of other parent: ${ showifdef('other_parent_phone_number') }

      Date of other parent consent: ${ showifdef('other_parent_date') }
  - Edit: children.revisit
    button: |
      **Children**

      % for item in children:
        * ${ item }
      % endfor
---
id: edit users
continue button field: users.revisit
question: |
  Edit users
subquestion: |
  ${ users.table }

  ${ users.add_action() }
---
table: users.table
rows: users
columns:
  - Name: |
      row_item.name_full() if defined("row_item.name.first") else ""
  - Signature: |
      row_item.signature if defined("row_item.signature") else ""
  - Phone number: |
      row_item.phone_number if defined("row_item.phone_number") else ""
edit:
  - name.first
  - phone_number
confirm: True
---
id: edit children
continue button field: children.revisit
question: |
  Edit children
subquestion: |
  ${ children.table }

  ${ children.add_action() }
---
table: children.table
rows: children
columns:
  - Name: |
      row_item.name_full() if defined("row_item.name.first") else ""
  - Birthdate: |
      row_item.birthdate if defined("row_item.birthdate") else ""
edit:
  - name.first
  - birthdate
confirm: True
---
id: download temporary_agent_esp_2
event: temporary_agent_esp_2_download
question: |
  All done
subquestion: |
  % if defined("users[0]"):
  Thank you ${ users }. Your form is ready to download and deliver.
  % else:
  Thank you. Your form is ready to download and deliver.
  % endif

  Use the options on this page to view, download and send your form. Use the
  "Edit answers" button to fix any mistakes.

  ${ action_button_html(url_action('review_temporary_agent_esp_2'), label=word('Edit answers'), color='info') }

  ${ al_user_bundle.download_list_html() }

  ${ al_user_bundle.send_button_html(show_editable_checkbox=False) }

progress: 100
---
# ALDocument objects specify the metadata for each template
objects:
  - temporary_agent_esp_2_Post_interview_instructions: ALDocument.using(filename="temporary_agent_esp_2_next_steps.docx", title=str(temporary_agent_esp_2_Post_interview_instructions_title), enabled=al_next_steps_enabled, has_addendum=False)
  - temporary_agent_esp_2_attachment: ALDocument.using(filename="temporary_agent_esp_2", title=str(temporary_agent_esp_2_attachment_title), enabled=True, has_addendum=False)
---
# Bundles group the ALDocuments into separate downloads, such as for court and for the user
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[temporary_agent_esp_2_Post_interview_instructions, temporary_agent_esp_2_attachment], filename="temporary_agent_esp_2", enabled=True, title=str(al_user_bundle_title))
  - al_recipient_bundle: ALDocumentBundle.using(elements=[temporary_agent_esp_2_attachment], filename="temporary_agent_esp_2", enabled=True, title=str(al_recipient_bundle_title))
---
template: temporary_agent_esp_2_Post_interview_instructions_title
content: |
  Instructions
---
template: temporary_agent_esp_2_attachment_title
content: |
  Temporary Agent Esp (2)
---
template: al_user_bundle_title
content: |
  All forms to download for your records
---
template: al_recipient_bundle_title
content: |
  All forms to file
---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the
# same template is used for "preview" and "final" keys, and logic in the template checks
# the value of `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: temporary_agent_esp_2_next_steps
  docx template file: temporary_agent_esp_2_next_steps.docx
  variable name: temporary_agent_esp_2_Post_interview_instructions[i]
  skip undefined: True
  tagged pdf: True
---
attachment:
  name: temporary agent esp 2
  filename: temporary_agent_esp_2
  variable name: temporary_agent_esp_2_attachment[i]
  skip undefined: True
  pdf template file: Temporary_Agent_Esp_2.pdf
  fields:
      - "user1_name": ${ users[0] }
      - "user1_printed_name": ${ users[0] }
      - "user1_address": ${ users[0].address.on_one_line() }
      - "user1_status_parent": ${ user1_status == 'parent' }
      - "user1_status_legal_guardian": ${ user1_status == 'legal_guardian' }
      - "user1_status_legal_custodian": ${ user1_status == 'legal_custodian' }
      - "temp_agent": ${ temp_agent_printed_name }
      - "temp_agent_address": ${ temp_agent.address.on_one_line() }
      - "child1_name": ${ children[0] }
      - "child2_name": ${ children.item(1) }
      - "child2_birth_date": ${ children.item(1).birthdate.format() }
      - "child1_birth_date": ${ children[0].birthdate.format() }
      - "child3_name": ${ children.item(2) }
      - "child3_birth_date": ${ children.item(2).birthdate.format() }
      - "child4_name": ${ children.item(3) }
      - "child4_birth_date": ${ children.item(3).birthdate.format() }
      - "prohibitive_acts": ${ prohibitive_acts }
      - "optional_agent": ${ optional_agent_printed_name if add_backup_agent else '' }
      - "optional_agent_address": ${ optional_agent.address.on_one_line() if add_backup_agent and defined('optional_agent.address.address') else '' }
      - "non_appointing_parent_has_given_consent": ${ non_appointing_parent_has_given_consent }
      - "non_appointing_parent_has_not_given_consent": ${ non_appointing_parent_has_not_given_consent }
      - "non_appointing_parent_deceased": ${ non_appointing_parent['deceased'] }
      - "non_appointing_parent_whereabouts_unknown": ${ non_appointing_parent['whereabouts_unknown'] }
      - "non_appointing_parent_unwilling": ${ non_appointing_parent['unwilling'] }
      - "non_appointing_parent_unable": ${ non_appointing_parent['unable'] }
      - "user1_phone_number": ${ user1_phone_number }
      - "temp_agent_acknowledgement": ${ temp_agent_acknowledgement }
      - "temp_agent_printed_name": ${ temp_agent_printed_name }
      - "temp_agent_phone_number": ${ temp_agent_phone_number }
      - "temp_agent_date": ${ temp_agent_date.format() if completing_form_with_agents and defined('temp_agent_date') else '' }
      - "optional_agent_name_acknowledgment": ${ optional_agent_name_acknowledgment if add_backup_agent else '' }
      - "optional_agent_printed_name": ${ optional_agent_printed_name if add_backup_agent else '' }
      - "optional_agent_phone_number": ${ optional_agent_phone_number if add_backup_agent else '' }
      - "optional_agent_date": ${ optional_agent_date.format() if add_backup_agent and completing_form_with_backup_agent and defined('optional_agent_date') else '' }
      - "other_parent": ${ other_parent_name or '' }
      - "other_parent_address": ${ other_parent.address.on_one_line() }
      - "other_temp_agent_name": ${ other_temp_agent_name }
      - "other_optional_agent_name": ${ other_optional_agent_name if add_backup_agent else '' }
      - "other_parent_date": ${ other_parent_date.format() if other_parent_date else '' }
      - "other_parent_name": ${ other_parent_name or '' }
      - "other_parent_phone_number": ${ other_parent_phone_number or '' }
