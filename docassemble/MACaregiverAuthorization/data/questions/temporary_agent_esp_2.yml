---
id: temporary_agent_form
continue button field: temporary_agent_esp_2_intro
question: "Temporary Agent Authorization Form"
subquestion: |2
  ### Is this form right for you?
  - Temporary Unavailability: You anticipate being temporarily unable to care for your child due to: planned medical procedures or illness, work or employment travel, family emergencies or fear of sudden separation (such as immigration enforcement).
  - A temporary agent authorization form allows you to choose a temporary agent to care for your child for up to 60 days.
  - The agent can make most of the choices you could make, like health care and school decisions.
  - You can change or cancel the agreement at any time. If you do, you must tell everyone involved.
  -You cannot use this form if a court ended your parental rights, if you signed a voluntary surrender, or if a court placed your child with someone else.
  - Your agent cannot agree to your child’s marriage or adoption.
  
  ### What do you need to complete this form?
  - You must complete this form while two witnesses watch.
  - Each witness must be at least 18, and your agent cannot be one of them.
  - Have your agent agree.
  - Get the other parent’s written permission if they are alive, easy to find, and able and willing to care for your child.
  
  ### When you are done
  - Have the form signed by witnesses and the chosen agent.
  - Have the form notarized.
  - Keep a copy for yourself and give copies to the chosen agent(s).
  
  You can use this form if you are a parent, legal guardian, or legal custodian and need someone to act for you in your child's care. Make sure the agent knows and agrees to the responsibilities given.
---
id: parent statements
continue button field: parent_statements_screen
question: |
  Important information
subquestion: |
  Please read the following statements:

  * There are no court orders in effect that would prohibit me from exercising or conferring the rights and responsibilities that I wish to confer upon the agent. (If you are the guardian or custodian, please attach the court order appointing you.)
  * I confer these rights and responsibilities freely and knowingly in order to provide for the child(ren) and not as a result of pressure, threats, or payments by any person or agency.
  * I understand that, if the affidavit is amended or revoked, I must provide the amended affidavit or revocation to all parties to whom I have provided the affidavit.
  * This document shall take effect only if and at such time as I am detained by any law enforcement agency, removed (deported) from the United States, or if my whereabouts is not known to my agent for a 24 hour period. Proof of my detention, deportation, or unavailability may be made by a copy of government document showing my detention or deportation, through the attestation of an attorney on my behalf, or through attestation of my agent.
  * This document shall remain in effect 60 days after it takes effect or until I notify the agent in writing that I have amended or revoked it.
---
id: Appointing Party Information
question: |2
  Your Information
fields:
  - Address: user1_address
  - Phone number: user1_phone_number
    datatype: al_international_phone
  - Parental Status: user1_status
    datatype: checkboxes
    choices:
      - {"Parent":"parent"}
      - {"Legal guardian":"legal_guardian"}
      - {"Legal custodian":"legal_custodian"}
---
id: agent statements
continue button field: agent_statements_screen
question: |
  Important information
subquestion: |
  The below statements are true and correct to the best of the Agent’s knowledge.

  * I am at least 18 years old.
  * I understand that I may, without obtaining further consent from a parent, legal custodian, or legal guardian of the child(ren), exercise power relative to the child(ren), except those powers prohibited above.
  * I understand that, if the affidavit is amended or revoked, I must provide the amended affidavit or revocation to all parties to whom I have provided this affidavit prior to further exercising any rights or responsibilities under the affidavit.
---
id: Temporary Agent Details
question: |
  Agent Details
subquestion: |
  Write the name and address of the person you want to take care of your child or children. This person is called “the agent.” The agent can make any decision for your children that you could make.
fields:
  - Name: temp_agent_printed_name
  - Address: temp_agent_address
  - Phone number: temp_agent_phone_number
    datatype: al_international_phone
  - Acknowledgment date: temp_agent_date
    datatype: date
---
# The agent's name is typed once, above. These copy it to every other place the
# form needs it, and give the temp_agent person a name for the signature page.
# `reconsider: True` keeps the copies in sync if the name is edited later.
reconsider: True
code: |
  temp_agent_acknowledgement = temp_agent_printed_name
  other_temp_agent_name = temp_agent_printed_name
  _temp_agent_parts = temp_agent_printed_name.strip().rsplit(' ', 1)
  temp_agent.name.first = _temp_agent_parts[0]
  temp_agent.name.middle = ''
  temp_agent.name.last = _temp_agent_parts[1] if len(_temp_agent_parts) > 1 else ''
  temp_agent.name.suffix = ''
---
id: Not allowed Acts
question: |
  Not allowed Acts
subquestion: |2
  Write down anything you don’t want the agent to do.
fields:
  - label: Acts not allowed for agent
    field: prohibitive_acts
    datatype: area
    required: False
---
id: Alternate Agent Information
question: |2
  Optional Backup Agent
subquestion: |2-
  If you want a backup agent, write his or her name here. 
  * The backup agent agrees that he or she cannot act for you until you are obtained or missing.
fields:
  - Name: optional_agent_printed_name
  - label: Address
    field: optional_agent_address
    required: False
  - Phone number: optional_agent_phone_number
    datatype: al_international_phone
  - label: Acknowledgment date
    field: optional_agent_date
    datatype: date
    required: False
---
# Same idea for the backup agent: one typed name fills the rest.
reconsider: True
code: |
  optional_agent_name_acknowledgment = optional_agent_printed_name
  other_optional_agent_name = optional_agent_printed_name
  _optional_agent_parts = optional_agent_printed_name.strip().rsplit(' ', 1)
  optional_agent.name.first = _optional_agent_parts[0]
  optional_agent.name.middle = ''
  optional_agent.name.last = _optional_agent_parts[1] if len(_optional_agent_parts) > 1 else ''
  optional_agent.name.suffix = ''
---
id: Non Appointing Parent Consent
question: |2
  The other parent
subquestion: |2-
  If you know who your child’s other parent is, and that parent agrees to the agent or agents, write their information here.
  
  If that parent has not agreed, check the box that tells why.
fields:
  - label: Consent received
    field: non_appointing_parent_has_given_consent
    datatype: yesno
    required: False
  - label: Not received
    field: non_appointing_parent_has_not_given_consent
    datatype: yesno
    required: False
  - label: Reason why consent was not received
    field: non_appointing_parent
    datatype: checkboxes
    choices:
      - {"Deceased":"deceased"}
      - {"Whereabouts unknown":"whereabouts_unknown"}
      - {"Unwilling":"unwilling"}
      - {"Unable":"unable"}
    required: False
  - label: Name of other parent
    field: other_parent_name
    required: False
  - label: Address of other parent
    field: other_parent_address
    required: False
  - label: Phone number of other parent
    field: other_parent_phone_number
    datatype: al_international_phone
    required: False
  - label: Date of other parent consent
    field: other_parent_date
    datatype: date
    required: False
---
# Gives the other_parent person a name (used on the signature page).
reconsider: True
code: |
  _other_parent_parts = (other_parent_name or '').strip().rsplit(' ', 1)
  other_parent.name.first = _other_parent_parts[0]
  other_parent.name.middle = ''
  other_parent.name.last = _other_parent_parts[1] if len(_other_parent_parts) > 1 else ''
  other_parent.name.suffix = ''
---
